name: Release

# Builds the site from a version tag and publishes that tag's GitHub release with the built site attached (.zip and
# .tar.gz, each with the licence), SHA-256 checksums and signed build provenance. Pushing a tag vX.Y.Z runs it; to
# rebuild the assets of an existing tag, run it by hand with that tag. The notes come from the CHANGELOG section.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, such as v0.6.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance
      attestations: write # store the provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version tag: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package the built site
        run: |
          version="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version" || { echo "package.json is not $version"; exit 1; }
          name="dream-street-$version"
          mkdir -p release "release/$name"
          cp -R dist/. "release/$name/"
          cp LICENSE "release/$name/LICENSE"
          # Fixed timestamps, owners and order make the archives depend only on the files, so a rebuild matches.
          epoch="$(git log -1 --format=%ct)"
          find "release/$name" -exec touch -h -d "@$epoch" {} +
          (cd release && find "$name" | LC_ALL=C sort | TZ=UTC zip -X -D -q "$name-site.zip" -@)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$epoch" -C release -cf - "$name" \
            | gzip -9n > "release/$name-site.tar.gz"
          rm -r "release/$name"
          (cd release && sha256sum "$name-site.zip" "$name-site.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*-site.zip
            release/*-site.tar.gz
      - name: Write the release notes
        run: |
          version="${TAG#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md \
            > "$RUNNER_TEMP/changes.md"
          test -s "$RUNNER_TEMP/changes.md" || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          {
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo '### Downloads'
            echo
            echo "- \`dream-street-$version-site.zip\` and \`dream-street-$version-site.tar.gz\` hold this version's built site, the files GitHub Pages serves, with the licence. Any static file server can serve the folder, at any path."
            echo '- `SHA256SUMS` lists their checksums: `sha256sum -c SHA256SUMS`.'
            echo "- Both archives carry signed build provenance: \`gh attestation verify dream-street-$version-site.zip -R ${{ github.repository }}\`."
            echo
            echo "The full history is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md)."
          } > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        run: |
          title="Dream Street ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --draft --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" release/*
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
