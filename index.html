<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9e6d9" />
    <meta name="description" content="一条一直走下去的街道。你可以静静看着。" />
    <title>Dream Street · 街道与倒影</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23294b47'/%3E%3Cpath d='M18 46L46 18M22 18H46V42' stroke='%23faf5e9' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  </head>
  <body>
    <main id="app">
      <div id="stage" aria-label="白昼街道：真人行走，橱窗倒影舞蹈"></div>
      <header class="masthead">
        <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><div><span class="eyebrow">A SMALL DAYDREAM</span><h1>Dream Street<span>街道与倒影</span></h1></div></div>
        <button id="about-toggle" class="quiet-button" aria-expanded="false" aria-controls="about">关于这条街</button>
      </header>
      <aside id="about" class="about" hidden><p>一个人向前走。玻璃里的他跳着舞。</p><p>衣服会变，街道会延续。你可以静静看着。</p><small>梦境片段 · G1<br>原创角色、编舞与程序化音乐</small></aside>
      <section id="entrance" class="entrance" aria-labelledby="entrance-title">
        <div class="entrance-card"><span class="eyebrow">THE ROAD GOES ON</span><h2 id="entrance-title">这条路，<br>一直走下去。</h2><p>旧衣服。新舞步。一个明亮的白昼。</p><button id="start" class="start-button">开始前行 <span aria-hidden="true">↗</span></button><small>带着声音观看 · 无需操作</small></div>
      </section>
      <footer class="controls">
        <div class="status"><span id="status-dot" class="status-dot"></span><span id="status">准备好了</span></div>
        <div class="playback"><button id="pause" class="control-button" disabled aria-label="暂停">暂停</button><span class="divider"></span><button id="mute" class="control-button" aria-label="静音" aria-pressed="false">声音</button><label class="volume"><span class="sr-only">音量</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.45" aria-label="音量"></label></div>
        <span class="footer-note">没有终点，也不用赶路。</span>
      </footer>
      <section id="error" class="error" role="alert" hidden><p id="error-message"></p><button id="retry" class="quiet-button">重新载入</button></section>
      <section id="debug" class="debug" hidden><strong>G1 · 现场检查</strong><div class="debug-actions"><button data-beat="0">从头</button><button data-beat="46">四连</button><button data-beat="60">旧装回归</button><button id="capture">录制 40 秒</button><label><input id="contacts" type="checkbox"> 接触线</label></div><pre id="diagnostics"></pre></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
